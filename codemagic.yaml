workflows:
  ios-ipa:
    name: iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.example.kelimelikIosHile"
      # Codemagic UI'dan ekle:
      # - App Store Connect API key VEYA
      # - Development certificate + provisioning profile
      # ios_signing:
      #   distribution_type: ad_hoc   # veya development / app_store
      #   bundle_identifier: $BUNDLE_ID
    scripts:
      - name: Flutter create iOS platform files
        script: |
          flutter create --platforms=ios .
      - name: Get packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          cd ios
          pod install
      - name: Flutter analyze (non-blocking)
        script: |
          flutter analyze || true
      - name: Build IPA
        script: |
          # Imzasiz/unsigned deneme (signing ayarlanmadiysa hata verebilir)
          # Codemagic'de Code signing identity bagladiktan sonra:
          flutter build ipa --release --no-codesign || flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
    publishing:
      email:
        recipients: []
        notify:
          success: true
          failure: true
