workflows:
  ios-ipa:
    name: iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.example.kelimelikIosHile"
    scripts:
      - name: Flutter create iOS platform files
        script: |
          flutter create --platforms=ios .
      - name: Get packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -path "*/ios/*" | head -1
          cd ios
          pod install
      - name: Flutter analyze (non-blocking)
        script: |
          flutter analyze || true
      - name: Build IPA
        script: |
          # First try unsigned (no Apple cert). If Codemagic signing is configured, signed build works too.
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
