name: kelimelik_ios_hile
description: Kelimelik iOS rebuild — protocol client + HILE autoplay (from Android RE)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/wordlist.txt
    - assets/images/
    - assets/sounds/
    - assets/fonts/
